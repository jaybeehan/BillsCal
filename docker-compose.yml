# Paste this into Synology Container Manager → Project → Create.
# Only the lines marked CHANGE need editing.
# Before creating the project, make an empty "data" folder inside the project folder
# (File Station), e.g. /docker/billscal/data — Synology won't create it for you.
# Your statements live only in that data folder on the NAS, never on GitHub.

services:
  billscal:
    image: ghcr.io/jaybeehan/billscal:latest
    pull_policy: always
    container_name: billscal
    restart: unless-stopped
    ports:
      - "18490:18490"                     # page at http://NAS-IP:18490
    environment:
      BILLSCAL_PASSWORD: "choose-a-password"   # CHANGE: password for the page
      TZ: "America/Edmonton"
      # Payday notification (6 am, every payday): bills for the next 2 weeks + total.
      NTFY_URL: "https://ntfy.sh/billscal-change-me-x7k2"   # CHANGE: your ntfy topic URL ("" = off)
      NTFY_TIME: "06:00"
      # NTFY_TOKEN: ""                  # only if your ntfy server needs a login token
      # BILLSCAL_URL: "http://jtnas:18490"   # tapping the notification opens this
      # Optional: 12-month utility averages from the Lacombe Utilities Google Sheet.
      # Copy service-account.json from /docker/utility-bills/data into /docker/billscal/data.
      SHEET_ID: "1bo1mBDDxPsKPg5e8BMskq0rOWWfD4Ye9cG4zSN3-KQY"
    volumes:
      - ./data:/data
